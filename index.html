<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Мой планировщик</title>
<meta name="theme-color" content="#4772FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Планировщик">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --accent:#4772FA;--accent-soft:rgba(71,114,250,.12);
  --bg:#F5F6F8;--card:#FFFFFF;--text:#1C1D21;--muted:#8A8F98;--line:#E7E9EE;
  --p3:#E5484D;--p2:#F5A524;--p1:#4772FA;--p0:#B4B8C0;
  --ok:#30A46C;--shadow:0 6px 24px rgba(20,24,40,.10);
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#121316;--card:#1C1D22;--text:#ECEDEF;--muted:#8B9099;--line:#2A2C33;--accent-soft:rgba(71,114,250,.22);--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme=dark]{--bg:#121316;--card:#1C1D22;--text:#ECEDEF;--muted:#8B9099;--line:#2A2C33;--accent-soft:rgba(71,114,250,.22);--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
#app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--top) + 8px) 16px 6px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0;flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:var(--text)}
.iconbtn:active{background:var(--line)}
.iconbtn svg{width:20px;height:20px}
main{flex:1;padding:4px 16px calc(96px + var(--bot))}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--bot)}
nav#tabs .wrap{display:flex;width:100%;max-width:720px}
nav#tabs button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
nav#tabs button span{display:none}
nav#tabs button svg{width:24px!important;height:24px!important}
nav#tabs button svg{width:24px;height:24px}
nav#tabs button.on{color:var(--accent)}
#fab{position:fixed;right:max(18px,calc(50% - 342px));bottom:calc(80px + var(--bot));z-index:6;width:50px;height:50px;border-radius:50%;background:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(71,114,250,.4);display:grid;place-items:center}
#fab svg{width:24px;height:24px}
.card{background:var(--card);border-radius:14px}
.quick{display:flex;gap:8px;margin:6px 0 14px}
.quick input{flex:1;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 13px;outline:none}
.quick input:focus{border-color:var(--accent)}
.hint{font-size:11px;color:var(--muted);margin:-8px 2px 12px}
.group{margin-bottom:16px}
.ghead{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);margin:0 4px 6px;text-transform:uppercase;letter-spacing:.03em}
.ghead.red{color:var(--p3)}
button.ghead{width:calc(100% - 8px);text-align:left;padding:4px 0;font-family:inherit}
.ghead .chev{width:14px;height:14px;flex:none;transition:transform .2s;margin-left:-2px}
.ghead.closed .chev{transform:rotate(-90deg)}
.ghead .cnt{font-weight:500;opacity:.8}
.task{display:flex;align-items:flex-start;gap:11px;padding:10px 13px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.chk{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--p0);margin-top:1px;display:grid;place-items:center}
.chk.p1{border-color:var(--p1)}.chk.p2{border-color:var(--p2)}.chk.p3{border-color:var(--p3)}
.chk.on{background:var(--muted);border-color:var(--muted)}
.chk.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tbody{flex:1;min-width:0}
.ttitle{word-wrap:break-word}
.task.done .ttitle{color:var(--muted);text-decoration:line-through}
.task.ghost{opacity:.6}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted);margin-top:3px}
.meta .red{color:var(--p3)}.meta .blue{color:var(--accent)}
.meta svg{width:12px;height:12px;vertical-align:-1px}
.tag{color:var(--accent)}
.meta .lname{margin-left:auto;display:inline-flex;align-items:center;gap:3px;max-width:45%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lem{font-size:1.05em;line-height:1;flex:none}
.dic{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none;font-size:12px;font-weight:700}
.dic svg{width:18px!important;height:18px!important}
.ditem .lem{width:25px;text-align:center;font-size:18px}
.ditem.child{padding-left:30px}
.ditem .fold{margin-left:6px;color:var(--muted);width:26px;height:26px;display:grid;place-items:center;flex:none}
.ditem .fold svg{width:16px!important;height:16px!important;transition:transform .2s}
.ditem .fold.closed svg{transform:rotate(-90deg)}
#drawer{display:flex;flex-direction:column}
.dhead{display:flex;align-items:center;gap:8px;margin:0 6px 12px 12px}
.dhead b{flex:1;font-size:18px}
.dscroll{flex:1;overflow:auto;min-height:0}
.dfoot{display:flex;align-items:center;border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.dfoot .ditem{flex:1}
.lcard{margin-bottom:12px}
.lhead{display:flex;align-items:center;gap:9px;width:100%;padding:12px 13px;text-align:left;font-weight:700;font-size:15px;color:var(--accent)}
.lhead .lem{font-size:19px}
.lhead .cnt{margin-left:auto;color:var(--muted);font-weight:500;font-size:14px}
.lhead svg{width:16px;height:16px;color:var(--muted);transition:transform .2s;transform:rotate(-90deg)}
.lhead.open svg{transform:none}
.lcard .task:first-of-type{border-top:1px solid var(--line)}
#title .lem{margin-right:8px}
#sheet .in.full{background:var(--bg);height:92vh;max-height:92vh;padding:0 16px calc(var(--bot) + 18px)}
.fhead{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;padding:16px 0 14px}
.fhead h2{flex:1;text-align:center;margin:0;font-size:16px;font-weight:600}
.fhead button{color:var(--accent);font-size:15px;min-width:90px;text-align:left}
.fhead button:last-child{text-align:right;font-weight:600}
.fhead button:disabled{opacity:.4}
.nameRow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:6px 14px;margin-bottom:14px}
.nameRow input{flex:1;border:0;background:transparent;outline:none;font-size:16px;padding:10px 0;min-width:0}
.emBtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:22px;color:var(--muted);flex:none}
.emBtn svg{width:24px;height:24px}
.emBtn.open{background:var(--accent-soft)}
.emGrid{display:none;grid-template-columns:repeat(8,1fr);gap:4px;background:var(--card);border-radius:14px;padding:10px;margin:-6px 0 14px}
.emGrid.on{display:grid}
.emGrid button{aspect-ratio:1;border-radius:10px;font-size:22px;display:grid;place-items:center}
.emGrid button.on{background:var(--accent-soft)}
.emGrid button.none{font-size:12px;color:var(--muted);grid-column:span 2;aspect-ratio:auto}
.fsec{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px}
.fsec h4{margin:0 0 14px;font-size:15px;font-weight:500}
.crow{display:flex;justify-content:space-between;gap:6px}
.cdot{width:32px;height:32px;border-radius:50%;flex:none;position:relative;border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--card)}
.cdot.on{border-color:var(--accent)}
.cdot.none{background:var(--card);border-color:var(--line)}
.cdot.none::after{content:"";position:absolute;left:50%;top:15%;bottom:15%;width:2px;background:var(--p3);transform:translateX(-50%) rotate(45deg)}
.cdot.none.on{border-color:var(--accent)}
.cdot.custom{background:conic-gradient(#f55,#fd3,#3d6,#3cf,#66f,#d5f,#f55);overflow:hidden}
.cdot.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0}
.vrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vcard{text-align:center;font-size:14px;color:var(--muted)}
.vcard .pv{height:96px;border:2px solid var(--line);border-radius:12px;margin-bottom:8px;position:relative;padding:10px;display:flex;flex-direction:column;gap:9px;overflow:hidden;background:var(--bg)}
.vcard.on{color:var(--accent);font-weight:600}
.vcard.on .pv{border-color:var(--accent)}
.vcard.on .pv::after{content:"✓";position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center}
.pv .ln{display:flex;align-items:center;gap:6px}.pv .ln i{width:8px;height:8px;border:1.5px solid var(--p0);border-radius:2px;flex:none}.pv .ln b{height:6px;border-radius:3px;background:var(--line);flex:1}
.pv.kb{flex-direction:row}.pv.kb>div{flex:1;background:var(--card);border-radius:6px;padding:5px;display:flex;flex-direction:column;gap:5px}.pv.kb>div b{display:block;height:14px;border-radius:4px;background:var(--line)}
.srow{display:flex;align-items:center;gap:8px;padding:12px 0;position:relative;font-size:15px}
.srow+.srow{border-top:1px solid var(--line)}
.srow .v{margin-left:auto;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:14px}
.srow .v svg{width:16px;height:16px}
.srow select{position:absolute;inset:0;opacity:0;width:100%;-webkit-appearance:none;appearance:none;border:0}
/* date picker */
#dp{position:fixed;inset:0;z-index:40;pointer-events:none}
#dp .dpScrim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .2s}
#dp .dpIn{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:720px;background:var(--bg);border-radius:18px 18px 0 0;max-height:94vh;overflow-y:auto;overflow-x:hidden;padding:0 16px calc(var(--bot) + 16px);transform:translateY(105%);transition:transform .25s;overscroll-behavior:contain}
#dp.on{pointer-events:auto}#dp.on .dpScrim{opacity:1}#dp.on .dpIn{transform:none}
.dpHead{display:flex;align-items:center;padding:16px 0 10px;position:sticky;top:0;background:var(--bg);z-index:3}
.dpHead button{color:var(--accent);font-size:15px;min-width:96px;text-align:left}
.dpHead button:last-child{text-align:right;font-weight:600}
.dpHead .dpTab{flex:1;text-align:center}
.dpHead .dpTab span{display:inline-block;padding:7px 16px;border-radius:18px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.dpBar{display:flex;align-items:center;margin:4px 0}
.dpBar .ttl{flex:1;text-align:center;font-weight:700;font-size:16px}
.dpGrid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;margin-bottom:14px}
.dpGrid .wd{text-align:center;font-size:13px;color:var(--muted);padding:8px 0}
.dpGrid button{height:40px;display:grid;place-items:center;font-size:16px;font-weight:500}
.dpGrid button span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.dpGrid button.t span{color:var(--accent);font-weight:700}
.dpGrid button.rep span{background:var(--accent-soft)}
.dpGrid button.on span{background:var(--accent);color:#fff}
.dpRows .srow.act,.dpRows .srow.act svg,.dpRows .srow.act .v{color:var(--accent)}
.dpRows{padding:0 16px}
.dpRows .srow svg{width:22px;height:22px;color:var(--muted);flex:none}
.dpRows .srow .v svg{width:16px;height:16px}
.dpRows .srow input,.dpRows .srow select{position:absolute;inset:0;opacity:0;width:100%;height:100%;-webkit-appearance:none;appearance:none;border:0;z-index:1}
.dpRows .srow .clr{position:relative;z-index:2;color:var(--muted);font-size:20px;line-height:1;padding:0 2px 0 6px}
.dpClear{display:block;margin:22px auto 6px;color:var(--p3);font-size:15px}
/* task editor */
.edTop{display:flex;align-items:center;gap:6px;margin:4px 0 6px}
.edList{position:relative;display:flex;align-items:center;gap:7px;font-size:15px;font-weight:500;padding:6px 4px;max-width:60%}
.edList span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edList .ud{width:14px;height:14px;color:var(--muted);flex:none}
.edList select{position:absolute;inset:0;opacity:0;width:100%;-webkit-appearance:none;appearance:none;border:0}
.edPanel{display:none;gap:6px;flex-wrap:wrap;margin:2px 0 10px}.edPanel.on{display:flex}
.edDateRow{display:flex;align-items:center;gap:12px;margin:10px 0 6px}
.edDate{font-size:15px;color:var(--accent);display:flex;align-items:center;gap:6px;text-align:left}
.edDate.red{color:var(--p3)}.edDate.none{color:var(--muted)}
.edDate svg{width:15px;height:15px;opacity:.8}
.edTitle{width:100%;border:0;background:transparent;outline:none;resize:none;font-size:21px;font-weight:600;line-height:1.3;padding:8px 0 4px;overflow:hidden}
.edNotes{width:100%;border:0;background:transparent;outline:none;resize:none;font-size:14px;line-height:1.45;padding:4px 0;min-height:60px;overflow:hidden;color:var(--text)}
.edBar{position:sticky;bottom:calc(-1 * (var(--bot) + 18px));background:var(--card);display:flex;align-items:center;gap:4px;padding:10px 0 calc(var(--bot) + 18px);margin-bottom:calc(-1 * (var(--bot) + 18px));border-top:1px solid var(--line);margin-top:16px}
.edBar .iconbtn{color:var(--muted)}
.edBar .iconbtn.on{color:var(--accent)}
/* menu ⋯ */
#menu{position:fixed;inset:0;z-index:35;display:none}
#menu.on{display:block}
#menu .mscrim{position:absolute;inset:0;background:rgba(0,0,0,.12)}
#menu .mbox{position:absolute;top:calc(var(--top) + 46px);right:max(10px,calc(50% - 350px));width:min(280px,82vw);max-height:calc(100vh - var(--top) - 70px);overflow:auto;background:var(--card);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.22);animation:mpop .14s ease-out;transform-origin:top right}
@keyframes mpop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;text-align:left;font-size:16px;border-bottom:1px solid var(--line)}
.mi:last-child{border-bottom:0}
.mi .ml{flex:1}
.mi .mic{width:22px;height:22px;display:grid;place-items:center;color:var(--text);flex:none}
.mi .mic svg{width:20px;height:20px}
.mi .arr{width:14px;color:var(--muted);flex:none;margin-left:-4px}
.mi .arr svg{width:14px;height:14px}
.mi.dis{opacity:.4}
.mi.danger{color:var(--p3)}.mi.danger .mic{color:var(--p3)}
.mi .ck{color:var(--accent);font-weight:700}
.msep{height:8px;background:var(--bg)}
.mhead{display:flex;align-items:center;gap:6px;padding:10px 10px 8px;font-weight:600;border-bottom:1px solid var(--line)}
.mhead button{color:var(--accent);display:flex;align-items:center}
.mhead button svg{width:20px;height:20px}
.msec{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 16px 4px}
.nodet .meta{display:none}
/* select mode */
.task.selected{background:var(--accent-soft)}
.selmode .chk{border-radius:50%;border-color:var(--muted)}
.selmode .chk.on{background:var(--accent);border-color:var(--accent)}
#selbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);display:none;justify-content:center;padding:6px 6px calc(var(--bot) + 6px)}
#selbar.on{display:flex}
#selbar .w{display:flex;width:100%;max-width:720px}
#selbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 0;color:var(--text)}
#selbar button svg{width:22px;height:22px}
#selbar button:disabled{opacity:.35}
#selbar button.danger{color:var(--p3)}
/* calendar views */
.calhd{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.calhd .ttl{flex:1;font-weight:700;font-size:17px;text-transform:capitalize;text-align:center}
.yr{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.ym{padding:4px;border-radius:10px;text-align:left}
.ym b{display:block;font-size:13px;margin:0 0 4px 2px;text-transform:capitalize}
.ym.cur b{color:var(--accent)}
.ym .g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:8.5px;text-align:center;color:var(--text)}
.ym .g i{font-style:normal;line-height:13px;border-radius:50%;margin:0 .5px}
.ym .g i.has{font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:3px;box-shadow:inset 0 0 0 1px var(--accent)}
.ym .g i.t{background:var(--accent);color:#fff;box-shadow:none}
.ym .g i.t.has{border-radius:3px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--card);border-radius:10px;overflow:hidden}
.mg .wdh{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0}
.mcell{min-height:78px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 2px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0}
.mcell .n{font-size:12px;padding-left:3px}
.mcell.out{opacity:.45}
.mcell.today .n{color:#fff;background:var(--accent);border-radius:9px;padding:0 5px;align-self:flex-start;font-weight:700}
.mcell.sel{background:var(--accent-soft)}
.mchip{text-align:left;display:block;width:100%;font-size:10px;line-height:14px;padding:0 3px;border-radius:3px;background:var(--accent-soft);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid var(--accent)}
.mchip.dn{opacity:.5;text-decoration:line-through}
.mmore{font-size:10px;color:var(--muted);padding-left:3px}
.tgw{background:var(--card);border-radius:12px;overflow:hidden}
.tgh,.tga{display:grid;border-bottom:1px solid var(--line)}
.tgh div{text-align:center;padding:6px 0;font-size:12px;color:var(--muted)}
.tgh div b{display:block;font-size:17px;color:var(--text);font-weight:600}
.tgh div.t,.tgh div.t b{color:var(--accent)}
.tga{min-height:28px}
.tga>div{padding:3px 2px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line);min-width:0}
.tga>div:first-child{border:0;font-size:10px;color:var(--muted);justify-content:center;align-items:center}
.tgb{height:calc(100vh - var(--top) - var(--bot) - 290px);min-height:300px;overflow-y:auto;position:relative}
.tgg{display:grid;position:relative}
.tgg .hl{position:relative}
.tgg .hl span{position:absolute;right:6px;transform:translateY(-50%);font-size:10px;color:var(--muted)}
.tgg .col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 48px)}
.ev{position:absolute;left:2px;right:2px;border-radius:5px;background:var(--accent-soft);border-left:3px solid var(--accent);font-size:11px;line-height:1.25;padding:2px 4px;overflow:hidden;text-align:left;color:var(--text)}
.ev small{display:block;color:var(--muted);font-size:10px}
.ev.dn{opacity:.5;text-decoration:line-through}
.nowl{position:absolute;left:0;right:0;height:2px;background:var(--p3);z-index:2}
.nowl::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--p3)}
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}
#sheet .in,#dp .dpIn{will-change:transform}
.wkstrip{display:grid;grid-template-columns:repeat(7,1fr);margin:0 0 8px}
.wkstrip button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
.wkstrip small{font-size:11px;color:var(--muted)}

const REPEATS={'':'Не повторять',daily:'Каждый день',weekdays:'По будням',weekly:'Каждую неделю',monthly:'Каждый месяц',yearly:'Каждый год'};

function listById(id){return S.lists.find(l=>l.id===id)||S.lists[0]}

function nextDate(date,rep){
  const d=pd(date);
  if(rep==='daily')d.setDate(d.getDate()+1);
  else if(rep==='weekdays'){do{d.setDate(d.getDate()+1)}while(d.getDay()===0||d.getDay()===6)}
  else if(rep==='weekly')d.setDate(d.getDate()+7);
  else if(rep==='monthly'){const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last))}
  else if(rep==='yearly')d.setFullYear(d.getFullYear()+1);
  return ds(d);
}
function occursOn(t,date){
  if(!t.date)return false;
  if(t.date===date)return true;
  if(!t.repeat||t.done||date<t.date)return false;
  const a=pd(t.date),b=pd(date);
  switch(t.repeat){
    case'daily':return true;
    case'weekdays':return b.getDay()!==0&&b.getDay()!==6;
    case'weekly':return a.getDay()===b.getDay();
    case'monthly':{const last=new Date(b.getFullYear(),b.getMonth()+1,0).getDate();return Math.min(a.getDate(),last)===b.getDate()}
    case'yearly':return a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
  }
  return false;
}
function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  if(!t.done&&t.repeat&&t.date){
    // сохранить выполненную копию и перенести задачу на следующую дату
    const copy=JSON.parse(JSON.stringify(t));copy.id=uid();copy.repeat='';copy.done=true;copy.doneAt=Date.now();
    S.tasks.push(copy);
    t.date=nextDate(t.date,t.repeat);t.notified=false;t.subtasks.forEach(s=>s.done=false);
    toast(`Готово! Следующий раз: ${fmtDate(t.date)}`);
  }else{
    t.done=!t.done;t.doneAt=t.done?Date.now():null;
  }
  save();render();
}
function sortTasks(a,b){
  if(a.done!==b.done)return a.done?1:-1;
  if((b.priority||0)!==(a.priority||0))return (b.priority||0)-(a.priority||0);
  const ta=a.time||'99',tb=b.time||'99';if(ta!==tb)return ta<tb?-1:1;
  return a.createdAt-b.createdAt;
}
/* быстрый ввод: сегодня/завтра/послезавтра, дни недели, 15:00, !1-!3, #тег */
function parseQuick(text){
  let s=' '+text+' ';const r={date:'',time:'',priority:0,tags:[]};const t=today();
  const rep=(re,fn)=>{s=s.replace(re,(...m)=>{fn(...m);return' '})};
  rep(/\s#([\wа-яё-]+)/gi,(m,g)=>r.tags.push(g.toLowerCase()));
  rep(/\s!([0-3])(?=\s)/g,(m,g)=>r.priority=+g);
  rep(/\s(?:в\s)?([01]?\d|2[0-3])[:.]([0-5]\d)(?=\s)/gi,(m,h,mi)=>r.time=pad(h)+':'+mi);
  rep(/\sпослезавтра(?=\s)/gi,()=>r.date=addDays(t,2));
  rep(/\sзавтра(?=\s)/gi,()=>r.date=addDays(t,1));
  rep(/\sсегодня(?=\s)/gi,()=>r.date=t);
  const days={'пн':0,'понедельник':0,'вт':1,'вторник':1,'ср':2,'среда':2,'среду':2,'чт':3,'четверг':3,'пт':4,'пятница':4,'пятницу':4,'сб':5,'суббота':5,'субботу':5,'вс':6,'воскресенье':6};
  rep(/\s(?:в[о]?\s)?(понедельник|вторник|среду|среда|четверг|пятницу|пятница|субботу|суббота|воскресенье|пн|вт|ср|чт|пт|сб|вс)(?=\s)/gi,(m,g)=>{
    const target=days[g.toLowerCase()];let diff=(target-wdi(t)+7)%7;if(diff===0)diff=7;r.date=addDays(t,diff)});
  if(r.time&&!r.date)r.date=t;
  r.title=s.replace(/\s+/g,' ').trim();
  return r;
}

function inSmart(x){const l=S.lists.find(q=>q.id===x.listId);return !(l&&l.hideSmart)}
function smartFilter(key){
  const t=today();
  switch(key){
    case'today':return x=>!x.done&&x.date&&x.date<=t&&inSmart(x);
    case'tomorrow':return x=>!x.done&&x.date===addDays(t,1)&&inSmart(x);
    case'week':return x=>!x.done&&x.date&&x.date<=addDays(t,6)&&inSmart(x);
    case'all':return x=>!x.done&&inSmart(x);
    case'done':return x=>x.done;
  }
  if(key.startsWith('tag:')){const g=key.slice(4);return x=>!x.done&&x.tags.includes(g)}
  if(key.startsWith('folder:')){const fid=key.slice(7);return x=>!x.done&&(listById(x.listId).folderId||'')===fid}
  return x=>!x.done&&x.listId===key;
}

const SORT_N={priority:'По приоритету',date:'По дате',title:'По названию',created:'Сначала новые'};
const GROUP_N={date:'По дате',list:'По списку',priority:'По приоритету',none:'Без группировки'};
const PRI_N=['Без приоритета','Низкий приоритет','Средний приоритет','Высокий приоритет'];
function makeGroups(key,items,g){
  const tdy=today();
  if(g==='list')return S.lists.map(l=>[(l.emoji?l.emoji+' ':'')+l.name,items.filter(t=>t.listId===l.id),'',{hideList:true}]);
  if(g==='priority')return [3,2,1,0].map(p=>[PRI_N[p],items.filter(t=>(t.priority||0)===p),p===3?'red':'']);
  if(g==='none')return [['Задачи',items]];
  const over=items.filter(t=>t.date&&t.date<tdy);
  if(key==='week'){
    const r=[['Просрочено',over,'red']];
    for(let i=0;i<7;i++){const d=addDays(tdy,i);const lab=i<2?fmtDate(d):`${WDL[wdi(d)][0].toUpperCase()+WDL[wdi(d)].slice(1)}, ${fmtDate(d)}`;r.push([lab,items.filter(t=>t.date===d),'',{hideDate:true}])}
    return r;
  }
  return [['Просрочено',over,'red'],['Сегодня',items.filter(t=>t.date===tdy),'',{hideDate:key==='today'}],['Завтра',items.filter(t=>t.date===addDays(tdy,1)),'',{hideDate:true}],['Позже',items.filter(t=>t.date&&t.date>addDays(tdy,1))],['Без даты',items.filter(t=>!t.date)]];

  const t=today();
  if(key==='today')return x=>x.done&&x.doneAt&&ds(new Date(x.doneAt))===t;
  if(key==='tomorrow')return x=>x.done&&x.date===addDays(t,1);
  if(key==='week')return x=>x.done&&x.doneAt&&ds(new Date(x.doneAt))>=addDays(t,-6);
  if(key==='all')return x=>x.done;
  if(key.startsWith('tag:'))return x=>x.done&&x.tags.includes(key.slice(4));
  if(key.startsWith('folder:'))return x=>x.done&&(listById(x.listId).folderId||'')===key.slice(7);
  return x=>x.done&&x.listId===key;
}
function taskRow(t,opts={}){
  const tdy=today();const l=listById(t.listId);
  const meta=[];
  if(t.date&&!opts.hideDate){const over=!t.done&&t.date<tdy;meta.push(`<span class="${over?'red':(t.date===tdy?'blue':'')}">${fmtDate(t.date)}${t.time?' '+t.time:''}</span>`)}
  else if(t.time)meta.push(`<span class="blue">${t.time}</span>`);
  if(t.repeat)meta.push(`<span>${I.rep}</span>`);
  if(t.remind!==null&&t.remind!==undefined&&t.time)meta.push(`<span>${I.bell}</span>`);
  if(t.subtasks.length)meta.push(`<span>${I.sub} ${t.subtasks.filter(s=>s.done).length}/${t.subtasks.length}</span>`);
  if(t.notes)meta.push(`<span>${I.note}</span>`);
  t.tags.forEach(g=>meta.push(`<span class="tag">#${esc(g)}</span>`));
  if(!opts.hideList&&U.list!==t.listId)meta.push(`<span class="lname">${l.emoji?`<span class="lem">${esc(l.emoji)}</span>`:`<i class="dot" style="background:${l.color};width:7px;height:7px;display:inline-block;margin:0"></i>`}${esc(l.name)}</span>`);
  const sel=U.sel&&U.sel.has(t.id);
  return `<div class="task ${t.done?'done':''} ${opts.ghost?'ghost':''} ${sel?'selected':''}" data-open="${t.id}">
    <button class="chk p${t.priority||0} ${(U.sel?sel:t.done)?'on':''}" data-chk="${t.id}" aria-label="Выполнить"></button>
    <div class="tbody"><div class="ttitle">${esc(t.title)}</div>${meta.length?`<div class="meta">${meta.join('')}</div>`:''}</div></div>`;
}
function isCollapsed(key){const c=S.settings.collapsed||{};return key in c?c[key]:false}
function group(title,items,cls='',rowOpts={}){
  if(!items.length)return'';
  const closed=isCollapsed(title);
  return `<div class="group"><button class="ghead ${cls} ${closed?'closed':''}" data-g="${esc(title)}" aria-expanded="${!closed}">${I.chev}<span>${esc(title)}</span><span class="cnt">${items.length}</span></button>${closed?'':`<div class="card">${items.map(x=>typeof x==='string'?x:taskRow(x,rowOpts)).join('')}</div>`}</div>`;
}
function visibleTasks(){
  if(U.list==='done')return S.tasks.filter(t=>t.done);
  const v=VS(U.list);let a=S.tasks.filter(smartFilter(U.list));if(v.showDone)a=a.concat(S.tasks.filter(doneFor(U.list)));return a;
}
function renderTasks(){
  if(U.list.startsWith('folder:')&&!folderById(U.list.slice(7)))U.list='today';
  if(!SMART[U.list]&&!U.list.startsWith('tag:')&&!U.list.startsWith('folder:')&&!S.lists.find(l=>l.id===U.list))U.list='today';
  $('#title').innerHTML=U.sel?`Выбрано: ${U.sel.size}`:titleHTML(U.list);
  if(U.sel){$('#topActions').innerHTML=`<button class="btn sec sm" id="selAll">Все</button> <button class="btn sm" id="selDone">Готово</button>`;
    $('#selAll').onclick=()=>{const ids=visibleTasks().map(t=>t.id);const all=ids.every(i=>U.sel.has(i));U.sel=all?new Set():new Set(ids);render()};
    $('#selDone').onclick=()=>{U.sel=null;render()};
    main.classList.add('selmode');
  }else{$('#topActions').innerHTML=`<button class="iconbtn" id="viewMenu" aria-label="Меню">${I.dots}</button>`;$('#viewMenu').onclick=listMenu}
  const v=VS(U.list);if(v.hideDetails)main.classList.add('nodet');
  if(U.list.startsWith('folder:')){renderFolder();return}
  const tdy=today();
  let html='';
  if(U.list!=='done'&&!U.sel){
    html+=`<form class="quick" id="quickForm"><input id="quickInp" placeholder="Добавить задачу…" autocomplete="off" enterkeyhint="done"></form>
    <div class="hint">Подсказка: «завтра 15:00», «пт», «!3» — приоритет, «#тег»</div>`;
  }
  const items=S.tasks.filter(smartFilter(U.list)).sort(SORTS[v.sortBy]||sortTasks);
  if(U.list==='done'){
    const byDay={};items.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).forEach(t=>{const k=t.doneAt?ds(new Date(t.doneAt)):'—';(byDay[k]=byDay[k]||[]).push(t)});
    Object.keys(byDay).forEach(k=>html+=group(k==='—'?'Без даты':fmtDate(k),byDay[k]));
    if(!items.length)html+=`<div class="empty"><b>✅</b>Здесь появятся выполненные задачи</div>`;
    main.innerHTML=html;bindTaskEvents();return;
  }
  const groups=makeGroups(U.list,items,v.groupBy);
  const dn=v.showDone?S.tasks.filter(doneFor(U.list)).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)):[];
  if(v.view==='kanban'){
    let cols=groups.filter(c=>c[1].length||c[0]!=='Просрочено');if(dn.length)cols.push(['Выполнено',dn]);
    cols=cols.filter(c=>!v.hiddenCols.includes(c[0]));
    html+=`<div class="kanban">${cols.map(([t,its,cls,o])=>`<div class="kcol"><div class="ghead ${cls||''}"><span>${esc(t)}</span><span class="cnt">${its.length}</span></div><div class="card">${its.length?its.map(x=>taskRow(x,Object.assign({hideList:v.groupBy==='list'},o||{}))).join(''):'<div class="kempty">Пусто</div>'}</div></div>`).join('')}</div>`;
  }else{
    groups.forEach(([t,its,cls,o])=>html+=group(t,its,cls,o));
    if(dn.length)html+=group('Выполнено',dn);
  }
  if(!items.length&&!dn.length)html+=`<div class="empty"><b>🌤️</b>Задач нет. Отдыхайте или добавьте новую.</div>`;
  main.innerHTML=html;
  bindTaskEvents();
  const qf=$('#quickForm');
  if(qf)qf.onsubmit=e=>{e.preventDefault();const val=$('#quickInp').value.trim();if(!val)return;
    const p=parseQuick(val);let listId='inbox';if(!SMART[U.list]&&!U.list.startsWith('tag:')&&!U.list.startsWith('folder:'))listId=U.list;
    const tags=p.tags.slice();if(U.list.startsWith('tag:')&&!tags.includes(U.list.slice(4)))tags.push(U.list.slice(4));
    let date=p.date;if(!date&&(U.list==='today'||U.list==='week'))date=today();if(!date&&U.list==='tomorrow')date=addDays(today(),1);
    S.tasks.push(newTask({title:p.title||val,listId,priority:p.priority,date,time:p.time,tags,remind:p.time?(S.settings.defRemind??0):null}));
    save();render();setTimeout(()=>{const i=$('#quickInp');i&&i.focus()},0);};
}
function renderFolder(){
  const fid=U.list.slice(7);const ls=listsIn(fid);let html='';
  if(!ls.length)html=`<div class="empty"><b>📁</b>В папке пока нет списков.<br><br><button class="btn" id="fAdd">Добавить список</button></div>`;
  ls.forEach(l=>{
    const ts=S.tasks.filter(t=>!t.done&&t.listId===l.id).sort(sortTasks);
    const key='fl:'+l.id;const c=S.settings.collapsed||{};const open=key in c?!c[key]:false;
    html+=`<div class="card lcard"><button class="lhead ${open?'open':''}" data-fl="${l.id}">${listIcon(l)}<span>${esc(l.name)}</span><span class="cnt">${ts.length||''}</span>${I.chev}</button>${open?ts.map(t=>taskRow(t)).join(''):''}</div>`;
  });
  main.innerHTML=html;
  main.querySelectorAll('[data-fl]').forEach(b=>b.onclick=()=>{const k='fl:'+b.dataset.fl;S.settings.collapsed=S.settings.collapsed||{};const c=S.settings.collapsed;c[k]=k in c?!c[k]:false;save();render()});
  const fa=$('#fAdd');if(fa)fa.onclick=()=>editList(null,fid);
  bindTaskEvents();
}
function bindTaskEvents(){
  main.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const k=b.dataset.g;S.settings.collapsed=S.settings.collapsed||{};S.settings.collapsed[k]=!isCollapsed(k);save();render()});
  const selT=id=>{U.sel.has(id)?U.sel.delete(id):U.sel.add(id);render()};
  main.querySelectorAll('[data-chk]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(U.sel)selT(b.dataset.chk);else toggleTask(b.dataset.chk)});
  main.querySelectorAll('[data-open]').forEach(r=>r.onclick=()=>{if(U.sel)selT(r.dataset.open);else openTask(r.dataset.open)});

/* ----- фон списка ----- */
const BGS=[['','Без фона'],['#E9B949','Песок'],['#2A9D8F','Мята'],['#4A9DFF','Небо'],['#8E4EC6','Сирень'],['#F4A261','Персик'],['#E5484D','Роза'],['#30A46C','Лес'],['#6E6E73','Графит']];
function isDark(){const t=S.settings.theme;return t==='dark'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function mix(a,b,k){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const c=[16,8,0].map(s=>Math.round(((pa>>s)&255)*(1-k)+((pb>>s)&255)*k));return '#'+c.map(x=>x.toString(16).padStart(2,'0')).join('')}
function applyBg(){

/* ----- меню ⋯ (как в TickTick) ----- */
function popMenu(items,title,back){
  const m=$('#menu'),box=m.querySelector('.mbox');
  box.innerHTML=(title?`<div class="mhead">${back?`<button id="mBack">${I.left}</button>`:''}<span>${title}</span></div>`:'')+items.map((it,i)=>{
    if(it.sep)return '<div class="msep"></div>';
    if(it.sec)return `<div class="msec">${it.sec}</div>`;
    return `<button class="mi ${it.dis?'dis':''} ${it.danger?'danger':''}" data-i="${i}">${it.sub?`<span class="arr">${I.right}</span>`:''}<span class="ml">${it.label}</span>${it.check?'<span class="ck">✓</span>':''}${it.icon?`<span class="mic">${it.icon}</span>`:''}</button>`;
  }).join('');
  box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.i];if(it.dis){if(it.hint)toast(it.hint);return}
    if(it.sub){popMenu(it.sub(),it.label,()=>popMenu(items,title,back));return}
    if(!it.keep)closeMenu();it.act&&it.act()});

}
function closeMenu(){$('#menu').classList.remove('on');lockScroll()}
function listMenu(){

function listText(){

function closeDrawer(){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on')}
$('#scrim').onclick=closeDrawer;
/* свайп вправо — открыть панель списков, свайп влево — закрыть */
(function(){
  const dr=$('#drawer'),sc=$('#scrim');let sx=0,sy=0,mode=null,w=0,dx=0;
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||$('#sheet').classList.contains('on'))return;
    const open=dr.classList.contains('on');
    if(!open&&(U.view!=='tasks'||(e.target.closest&&e.target.closest('input,textarea,select'))))return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;mode=open?'close?':'open?';w=dr.offsetWidth;dx=0;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!mode)return;const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
    if(mode.endsWith('?')){
      if(Math.abs(x)<10&&Math.abs(y)<10)return;
      if(Math.abs(x)>Math.abs(y)*1.3&&((mode==='open?'&&x>0)||(mode==='close?'&&x<0))){mode=mode.slice(0,-1);dr.style.transition='none';sc.style.transition='none';
        if(mode==='open'){openDrawer();dr.style.transform=`translateX(-${w}px)`}}
      else{mode=null;return}
    }
    dx=x;
    const pos=mode==='open'?Math.min(0,-w+x):Math.min(0,x);
    dr.style.transform=`translateX(${pos}px)`;sc.style.opacity=String(1+pos/w);
  },{passive:true});
  document.addEventListener('touchend',()=>{
    if(!mode||mode.endsWith('?')){mode=null;return}
    dr.style.transition='';sc.style.transition='';dr.style.transform='';sc.style.opacity='';
    if(mode==='open'&&dx<w*0.3)closeDrawer();
    if(mode==='close'&&dx<-w*0.3)closeDrawer();
    mode=null;
  });
})();

/* ----- sheet ----- */
let sheetClose=null;
function openSheet(html,onClose,compact){
  const s=$('#sheet');const inn=s.querySelector('.in');const full=compact==='full';inn.classList.toggle('compact',compact===true);inn.classList.toggle('full',full);inn.innerHTML=(compact?'':'<div class="grab"></div>')+html;s.querySelector('.in').scrollTop=0;
  inn.style.transform='';s.classList.add('on');const sc=$('#sheetScrim');sc.style.opacity=1;sc.style.pointerEvents='auto';
  sheetClose=onClose||null;lockScroll();
}
function closeSheet(skipCb){
  if(!skipCb&&sheetClose){const f=sheetClose;sheetClose=null;f()}else sheetClose=null;
  $('#sheet').classList.remove('on');const sc=$('#sheetScrim');sc.style.opacity=0;sc.style.pointerEvents='none';
  if(document.activeElement)document.activeElement.blur();lockScroll();
}
$('#sheetScrim').onclick=()=>closeSheet();
/* блокировка прокрутки страницы под открытыми окнами */
function lockScroll(){const on=$('#sheet').classList.contains('on')||$('#dp').classList.contains('on')||$('#menu').classList.contains('on');document.documentElement.classList.toggle('lock',on)}
['#sheetScrim','#dp .dpScrim','#menu .mscrim','#scrim'].forEach(s=>{const el=$(s);if(el)el.addEventListener('touchmove',e=>e.preventDefault(),{passive:false})});
/* смахивание вниз закрывает окно (как в TickTick) */
function dragDismiss(panel,close){
  let y0=null,dy=0,drag=false;
  panel.addEventListener('touchstart',e=>{if(e.touches.length!==1){y0=null;return}y0=e.touches[0].clientY;dy=0;drag=false},{passive:true});
  panel.addEventListener('touchmove',e=>{
    if(y0===null)return;dy=e.touches[0].clientY-y0;
    if(!drag){
      const inner=e.target.closest&&e.target.closest('.tgb,.kanban,.qa-panel,textarea');
      const innerScrolled=inner&&inner.scrollTop>0;
      if(dy>4&&panel.scrollTop<=0&&!innerScrolled){drag=true;panel.style.transition='none';if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}
      else if(dy<-4||(dy>4&&panel.scrollTop>0)){y0=null;return}
      else return;
    }
    e.preventDefault();panel.style.transform=`translateY(${Math.max(0,dy)}px)`;
  },{passive:false});
  const end=()=>{if(drag){panel.style.transition='';if(dy>Math.min(120,panel.offsetHeight*.25)){close();setTimeout(()=>{panel.style.transform=''},300)}else panel.style.transform=''}y0=null;drag=false};
  panel.addEventListener('touchend',end);panel.addEventListener('touchcancel',end);
}
dragDismiss($('#sheet .in'),()=>{$('#sheet .in').style.transform='';closeSheet()});
dragDismiss($('#dp .dpIn'),()=>{const dp=$('#dp');dp._cancel?dp._cancel():dp.classList.remove('on')});

/* ----- quick add (компактное окно над клавиатурой) ----- */
function quickAdd(pre={}){
  const st={date:pre.date||'',time:pre.time||'',priority:0,listId:pre.listId||'inbox',tags:(pre.tags||[]).slice()};
  openSheet(`<input class="qa-title" id="qaTitle" placeholder="Что бы вы хотели сделать?" autocomplete="off" enterkeyhint="send">
    <input class="qa-note" id="qaNote" placeholder="Описание" autocomplete="off">
    <div class="qa-panel" id="qaPanel"></div>
    <div class="qa-bar">
      <button class="qa-btn" id="qaDateB" aria-label="Дата">${I.cal}<span id="qaDateL"></span></button>
      <button class="qa-btn" id="qaPri" aria-label="Приоритет">${I.flag}</button>
      <button class="qa-btn" id="qaTag" aria-label="Тег">${I.tag}</button>
      <button class="qa-btn" id="qaListB" aria-label="Список"><span id="qaListI"></span><span id="qaListL"></span></button>
      <button class="qa-btn" id="qaMore" aria-label="Ещё" style="font-size:20px;letter-spacing:1px">⋯</button>
      <span class="qa-sp"></span>
      <button class="qa-send" id="qaSend" aria-label="Добавить" disabled>${I.send}</button>
    </div>`,()=>{if(SI('#qaTitle').value.trim())add(false)},true);
  const ti=SI('#qaTitle');const pn=SI('#qaPanel');
  let lastInp=ti;ti.onfocus=()=>lastInp=ti;SI('#qaNote').onfocus=()=>lastInp=SI('#qaNote');
  // вернуть фокус (и клавиатуру) в поле, где печатали; вызывается прямо в обработчике нажатия
  const back=()=>{try{lastInp.focus({preventScroll:true})}catch(e){lastInp.focus()}};
  // кнопки панели не забирают фокус у поля ввода — клавиатура не прячется
  const keep=el=>el.addEventListener('mousedown',e=>e.preventDefault());
  SA('.qa-bar button').forEach(keep);
  const PRI=['Без приоритета','Низкий','Средний','Высокий'];
  let panel='';
  function chip(val,label,on,extra=''){return `<button class="chip ${on?'on':''}" data-v="${esc(val)}" ${extra}>${label}</button>`}
  function showPanel(kind){
    panel=panel===kind?'':kind;
    SA('.qa-bar .qa-btn').forEach(b=>b.classList.remove('open'));
    if(!panel){pn.innerHTML='';pn.classList.remove('on');back();return}
    const t=today();let html='';
    if(kind==='date'){
      const nm=addDays(t,(7-wdi(t))%7||7);
      html=[chip(t,'Сегодня',st.date===t),chip(addDays(t,1),'Завтра',st.date===addDays(t,1)),chip(addDays(t,2),'Послезавтра',st.date===addDays(t,2)),chip(nm,'След. пн',st.date===nm),chip('','Без даты',!st.date)].join('')
        +chip('pick','Другая…',false);
    }else if(kind==='time'){
      html=['09:00','12:00','15:00','18:00','21:00'].map(x=>chip(x,x,st.time===x)).join('')+chip('','Без времени',!st.time)
        +chip('pick','Другое…',false);
    }else if(kind==='pri'){
      html=[3,2,1,0].map(p=>chip(p,`<span style="color:${p?`var(--p${p})`:'var(--muted)'}">⚑</span> ${PRI[p]}`,st.priority===p)).join('');
    }else if(kind==='list'){
      html=S.lists.map(l=>chip(l.id,(l.emoji?esc(l.emoji)+' ':`<i class="dot" style="background:${l.color};width:8px;height:8px;display:inline-block;margin:0 4px 0 0"></i>`)+esc(l.name),st.listId===l.id)).join('');
    }else if(kind==='more'){
      html=chip('time','🕐 Время',!!st.time)+chip('note','📝 Описание',SI('#qaNote').classList.contains('on'))+chip('exp','⤢ Подробнее',false);
    }
    pn.innerHTML=html;pn.classList.add('on');
    SI({date:'#qaDateB',time:'#qaMore',pri:'#qaPri',list:'#qaListB',more:'#qaMore'}[kind]).classList.add('open');
    pn.querySelectorAll('button.chip').forEach(c=>{keep(c);c.onclick=()=>{
      const v=c.dataset.v;
      if(kind==='more'){
        panel='';pn.innerHTML='';pn.classList.remove('on');SA('.qa-bar .qa-btn').forEach(b=>b.classList.remove('open'));
        if(v==='time'){showPanel('time');return}
        if(v==='note'){const n=SI('#qaNote');n.classList.add('on');lastInp=n;n.focus();return}
        if(v==='exp'){expand();return}
      }
      if(v==='pick'&&(kind==='date'||kind==='time')){
        panel='';pn.innerHTML='';pn.classList.remove('on');SA('.qa-bar .qa-btn').forEach(b=>b.classList.remove('open'));
        datePicker({date:st.date,time:st.time,remind:st.remind??null,repeat:st.repeat||''},r=>{st.date=r.date;st.time=r.time;st.remind=r.remind;st.repeat=r.repeat;draw();back()},back);return}
      if(kind==='date')st.date=v;
      else if(kind==='time'){st.time=v;if(v&&!st.date)st.date=today()}
      else if(kind==='pri')st.priority=+v;
      else if(kind==='list')st.listId=v;
      panel='';pn.innerHTML='';pn.classList.remove('on');SA('.qa-bar .qa-btn').forEach(b=>b.classList.remove('open'));
      draw();back();
    }});
    const dx=pn.querySelector('#qaDateX'),tx=pn.querySelector('#qaTimeX');
    const fin=()=>{panel='';pn.innerHTML='';pn.classList.remove('on');SA('.qa-bar .qa-btn').forEach(b=>b.classList.remove('open'));draw();back()};
    if(dx)dx.onchange=()=>{st.date=dx.value;fin()};
    if(tx)tx.onchange=()=>{st.time=tx.value;if(st.time&&!st.date)st.date=today();fin()};
  }
  function draw(){
    SI('#qaDateL').textContent=st.date?fmtDate(st.date)+(st.time?', '+st.time:''):(st.time||'');SI('#qaDateB').classList.toggle('set',!!(st.date||st.time));
    const pb=SI('#qaPri');pb.style.color=st.priority?`var(--p${st.priority})`:'';
    const l=listById(st.listId);SI('#qaListI').innerHTML=l.emoji?`<span class="lem">${esc(l.emoji)}</span>`:I.folder;SI('#qaListL').textContent=l.name;SI('#qaListB').classList.add('set');
    SI('#qaSend').disabled=!ti.value.trim();
  }
  function add(keepOpen){
    const v=ti.value.trim();if(!v)return;
    const p=parseQuick(v);
    const date=p.date||st.date,time=p.time||st.time;
    const tags=[...new Set([...st.tags,...p.tags])];
    S.tasks.push(newTask({title:p.title||v,notes:SI('#qaNote').value.trim(),listId:st.listId,priority:p.priority||st.priority,date:time&&!date?today():date,time,tags,repeat:st.repeat||'',remind:st.remind!==undefined&&st.remind!==null?st.remind:(time?(S.settings.defRemind??0):null)}));
    save();render();
    if(keepOpen){closeSheet(true);toast('Задача добавлена')}
  }
  ti.oninput=draw;
  ti.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add(true)}};
  SI('#qaNote').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add(true)}};
  SI('#qaDateB').onclick=()=>showPanel('date');
  SI('#qaMore').onclick=()=>showPanel('more');
  SI('#qaPri').onclick=()=>showPanel('pri');
  SI('#qaListB').onclick=()=>showPanel('list');
  SI('#qaTag').onclick=()=>{const v=ti.value;ti.value=v+(v&&!v.endsWith(' ')?' ':'')+'#';lastInp=ti;ti.focus();ti.setSelectionRange(ti.value.length,ti.value.length);draw()};
  function expand(){
    const p=parseQuick(ti.value.trim());
    const preset={title:p.title||ti.value.trim(),notes:SI('#qaNote').value,listId:st.listId,priority:p.priority||st.priority,date:p.date||st.date,time:p.time||st.time,repeat:st.repeat||'',tags:[...new Set([...st.tags,...p.tags])]};

function fmtLong(d,time){
  if(!d)return time||'';
  const t=today(),dd=pd(d);const rel=d===t?'Сегодня':d===addDays(t,1)?'Завтра':d===addDays(t,-1)?'Вчера':WD[wdi(d)];
  const y=dd.getFullYear()!==new Date().getFullYear()?' '+dd.getFullYear():'';
  return `${rel}, ${dd.getDate()} ${MONS[dd.getMonth()]}${y}${time?', '+time:''}`;
}
const WDACC=['понедельник','вторник','среду','четверг','пятницу','субботу','воскресенье'];
function repLabel(st){

/* ----- ICS export ----- */
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function exportICS(t){
  const d=t.date.replace(/-/g,'');const now=new Date();
  const stamp=now.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Planner//RU','CALSCALE:GREGORIAN','BEGIN:VEVENT',`UID:${t.id}@planner`,`DTSTAMP:${stamp}`,`SUMMARY:${icsEsc(t.title)}`];
  if(t.time){const[h,m]=t.time.split(':');L.push(`DTSTART:${d}T${h}${m}00`,`DURATION:PT${t.dur||60}M`)}
  else{L.push(`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${addDays(t.date,1).replace(/-/g,'')}`)}
  const desc=[t.notes,...t.subtasks.map(s=>(s.done?'☑ ':'☐ ')+s.title)].filter(Boolean).join('\n');if(desc)L.push(`DESCRIPTION:${icsEsc(desc)}`);
  const rr={daily:'FREQ=DAILY',weekdays:'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR',weekly:'FREQ=WEEKLY',monthly:'FREQ=MONTHLY',yearly:'FREQ=YEARLY'}[t.repeat];if(rr)L.push('RRULE:'+rr);
  const rem=t.remind===null||t.remind===undefined?(t.time?null:null):t.remind;
  if(rem!==null){L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(t.title)}`,`TRIGGER:-PT${rem}M`,'END:VALARM')}
  else if(!t.time){L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(t.title)}`,'TRIGGER:PT9H','END:VALARM')}
  L.push('END:VEVENT','END:VCALENDAR');
  const name=(t.title.slice(0,40).replace(/[\\/:*?"<>|]/g,'')||'task')+'.ics';
  if(inFrame){toast('В режиме предпросмотра скачивание недоступно. Работает в установленной версии на iPhone.');return}
  downloadText(name,L.join('\r\n'),'text/calendar');
  if(isIOS)toast('Откроется окно Календаря — нажмите «Добавить»');
}
function downloadText(name,text,mime){
  const blob=new Blob([text],{type:mime+';charset=utf-8'});const url=URL.createObjectURL(blob);
  if(isIOS&&mime==='text/calendar'){location.href=url;setTimeout(()=>URL.revokeObjectURL(url),60000);return}
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}

     <div class="actions"><span class="sp"></span><button class="btn sec" id="hedit">Изменить</button></div>`);
    SI('#hx').onclick=()=>closeSheet();SI('#hedit').onclick=()=>{closeSheet(true);editHabit(id)};
    SI('#hp').onclick=()=>{ref.setMonth(ref.getMonth()-1);draw()};SI('#hn').onclick=()=>{ref.setMonth(ref.getMonth()+1);draw()};
  };
  draw();
}

/* ----- pomodoro ----- */
const MODES={work:'Фокус',short:'Перерыв',long:'Длинный перерыв'};
function modeLen(m){return (m==='work'?S.pomo.work:m==='short'?S.pomo.short:S.pomo.long)*60}
function timerLeft(){const T=S.timer;return T.running?Math.max(0,Math.round((T.endsAt-Date.now())/1000)):T.left}
function setMode(m){const T=S.timer;T.mode=m;T.running=false;T.left=modeLen(m);save()}
function startPause(){
  const T=S.timer;ensureAudio();
  if(T.running){T.left=timerLeft();T.running=false}else{T.endsAt=Date.now()+timerLeft()*1000;T.running=true}
  save();render();
}
function finishTimer(auto){
  const T=S.timer;const was=T.mode;
  if(was==='work'){
    const min=Math.round((modeLen('work')-(auto?0:timerLeft()))/60);
    if(min>0)S.pomo.sessions.push({date:today(),at:Date.now(),min,taskId:T.taskId||''});
    T.count++;
    setMode(T.count%S.pomo.every===0?'long':'short');
  }else setMode('work');
  if(auto){beep();notify(was==='work'?'Помодоро завершён 🍅':'Перерыв окончен',was==='work'?'Время отдохнуть.':'Пора вернуться к работе.');toast(was==='work'?'Помодоро завершён! Время отдохнуть.':'Перерыв окончен — за работу!');
    if(S.pomo.auto){T.endsAt=Date.now()+modeLen(T.mode)*1000;T.running=true}}
  save();if(U.view==='focus')render();
}
function renderFocus(){
  $('#title').textContent='Фокус';
  const T=S.timer;const left=timerLeft();const total=modeLen(T.mode);
  const C=2*Math.PI*45;const frac=1-left/total;
  const tdy=today();const todayS=S.pomo.sessions.filter(s=>s.date===tdy);const tMin=todayS.reduce((a,s)=>a+s.min,0);
  const days=[];for(let i=6;i>=0;i--){const d=addDays(tdy,-i);days.push([d,S.pomo.sessions.filter(s=>s.date===d).reduce((a,s)=>a+s.min,0)])}
  const mx=Math.max(25,...days.map(x=>x[1]));
  const tasks=S.tasks.filter(t=>!t.done).sort(sortTasks).slice(0,60);
  const color=T.mode==='work'?'var(--accent)':'var(--ok)';
  main.innerHTML=`
   <div class="seg">${Object.entries(MODES).map(([k,v])=>`<button data-mode="${k}" class="${T.mode===k?'on':''}">${v}</button>`).join('')}</div>
   <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--line)" stroke-width="4"/>
     <circle id="ringArc" cx="50" cy="50" r="45" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg>
     <div class="tm"><b id="ringTime">${pad(Math.floor(left/60))}:${pad(left%60)}</b><span>${MODES[T.mode]} · #${T.count%S.pomo.every+1}</span></div></div>
   <div class="fctl"><button class="btn sec" id="fReset">Сброс</button><button class="btn" id="fStart" style="background:${color}">${T.running?'Пауза':'Старт'}</button><button class="btn sec" id="fSkip">Далее</button></div>
   <div class="field"><label>Над чем работаю</label><select class="inp" id="fTask"><option value="">— без задачи —</option>${tasks.map(t=>`<option value="${t.id}" ${t.id===T.taskId?'selected':''}>${esc(t.title)}</option>`).join('')}</select></div>
   <div class="card sec mt"><h3>Сегодня</h3><div class="stats" style="margin:0"><div class="stat"><b>${todayS.length}</b><span>${plural(todayS.length,'помидор','помидора','помидоров')}</span></div><div class="stat"><b>${Math.floor(tMin/60)}ч ${tMin%60}м</b><span>в фокусе</span></div><div class="stat"><b>${S.pomo.sessions.length}</b><span>всего</span></div></div>
     <div class="bars">${days.map(([d,v])=>`<div class="b"><span>${v||''}</span><i style="height:${Math.max(3,v/mx*70)}px;${d===tdy?'':'opacity:.55'}"></i><span>${WD[wdi(d)]}</span></div>`).join('')}</div></div>
   <div class="card sec mt"><h3>Настройки таймера</h3>
     <div class="row"><div class="field"><label>Фокус, мин</label><input type="number" min="1" max="180" class="inp" id="pw" value="${S.pomo.work}"></div><div class="field"><label>Перерыв</label><input type="number" min="1" max="60" class="inp" id="ps" value="${S.pomo.short}"></div><div class="field"><label>Длинный</label><input type="number" min="1" max="90" class="inp" id="pl" value="${S.pomo.long}"></div></div>
     <div class="row"><div class="field"><label>Длинный перерыв каждые</label><select class="inp" id="pe">${[2,3,4,5,6].map(n=>`<option ${n===S.pomo.every?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Автостарт следующего</label><select class="inp" id="pa"><option value="0">Нет</option><option value="1" ${S.pomo.auto?'selected':''}>Да</option></select></div></div>
     <p class="note">Таймер считает по часам, поэтому не сбивается, если свернуть приложение. Сигнал прозвучит, когда вы вернётесь в приложение, если оно было свёрнуто.</p></div>`;
  main.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{setMode(b.dataset.mode);render()});
  $('#fStart').onclick=startPause;
  $('#fReset').onclick=()=>{setMode(T.mode);render()};
  $('#fSkip').onclick=()=>finishTimer(false);
  $('#fTask').onchange=e=>{T.taskId=e.target.value;save()};
  const upd=()=>{const w=Math.max(1,+$('#pw').value||25),s=Math.max(1,+$('#ps').value||5),l=Math.max(1,+$('#pl').value||15);
    S.pomo.work=w;S.pomo.short=s;S.pomo.long=l;S.pomo.every=+$('#pe').value;S.pomo.auto=$('#pa').value==='1';
    if(!T.running)T.left=modeLen(T.mode);save();const lft=timerLeft();$('#ringTime').textContent=`${pad(Math.floor(lft/60))}:${pad(lft%60)}`};
  ['#pw','#ps','#pl','#pe','#pa'].forEach(s=>$(s).onchange=upd);
}
function tick(){
  const T=S.timer;
  if(T.running){
    const left=timerLeft();
    if(left<=0){finishTimer(true);return}
    if(U.view==='focus'){const el=$('#ringTime');const arc=$('#ringArc');if(el)el.textContent=`${pad(Math.floor(left/60))}:${pad(left%60)}`;
      if(arc){const C=2*Math.PI*45;arc.setAttribute('stroke-dashoffset',C*(left/modeLen(T.mode)))}}
    document.title=`${pad(Math.floor(left/60))}:${pad(left%60)} · ${MODES[T.mode]}`;
  }else if(document.title!=='Мой планировщик')document.title='Мой планировщик';
}
let actx=null;
function ensureAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){try{ensureAudio();if(!actx)return;const t0=actx.currentTime;[0,.35,.7].forEach(o=>{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=880;os.type='sine';g.gain.setValueAtTime(.0001,t0+o);g.gain.exponentialRampToValueAtTime(.3,t0+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+o+.3);os.connect(g).connect(actx.destination);os.start(t0+o);os.stop(t0+o+.32)})}catch(e){}if(navigator.vibrate)navigator.vibrate([200,100,200])}

/* ----- reminders ----- */
let swReg=null;
function notify(title,body){
  if(!S.settings.notify||!('Notification' in window)||Notification.permission!=='granted')return;
  try{if(swReg&&swReg.showNotification)swReg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag:title+body});else new Notification(title,{body})}catch(e){}
}
function checkReminders(){
  const now=Date.now();let changed=false;
  S.tasks.forEach(t=>{
    if(t.done||t.notified||t.remind===null||t.remind===undefined||!t.date||!t.time)return;
    const[h,m]=t.time.split(':').map(Number);const d=pd(t.date);d.setHours(h,m,0,0);
    const fire=d.getTime()-t.remind*60000;
    if(now>=fire){t.notified=true;changed=true;
      if(now-fire<6*3600000){const body=(t.remind?`Через ${REMINDS[t.remind].replace('За ','')}`:'Сейчас')+` · ${t.time}`;notify(t.title,body);toast(`🔔 ${t.title} — ${t.time}`);beep()}}
  });
  if(changed)save();
}

/* ----- more / settings ----- */
function renderMore(){
  $('#title').textContent='Ещё';
  const perm=('Notification' in window)?Notification.permission:'unsupported';
  const nstate=perm==='unsupported'?(isIOS&&!standalone?'Сначала установите приложение на экран «Домой»':'Не поддерживается этим браузером'):perm==='granted'&&S.settings.notify?'Включены':perm==='denied'?'Запрещены в настройках iPhone':'Выключены';
  const tCount=S.tasks.filter(t=>!t.done).length,dCount=S.tasks.filter(t=>t.done).length;
  main.innerHTML=`
   <div class="card">
    <div class="lrow"><div class="l">Тема</div><div class="seg" style="width:200px">${[['auto','Авто'],['light','Светлая'],['dark','Тёмная']].map(([k,v])=>`<button data-th="${k}" class="${S.settings.theme===k?'on':''}">${v}</button>`).join('')}</div></div>
    <div class="lrow"><div class="l">Цвет оформления</div><div class="chips" style="flex-wrap:nowrap">${ACCENTS.map(c=>`<button class="swatch ${c===(S.settings.accent||'#4772FA')?'on':''}" data-acc="${c}" style="background:${c};width:26px;height:26px"></button>`).join('')}</div></div>
    <div class="lrow"><div class="l">Уведомления<small>${nstate}</small></div>${perm!=='unsupported'&&perm!=='denied'?`<button class="btn sm ${S.settings.notify&&perm==='granted'?'sec':''}" id="nBtn">${S.settings.notify&&perm==='granted'?'Выключить':'Включить'}</button>`:''}</div>
    <div class="lrow"><div class="l">Напоминание по умолчанию<small>для задач со временем</small></div><select class="inp" id="defRem" style="width:auto">${Object.entries(REMINDS).map(([k,v])=>`<option value="${k}" ${String(S.settings.defRemind??'')===k?'selected':''}>${v}</option>`).join('')}</select></div>
    ${S.settings.notify&&perm==='granted'?`<div class="lrow"><div class="l">Проверить уведомление</div><button class="btn sec sm" id="nTest">Тест</button></div>`:''}
   </div>
   <div class="card mt">
    <div class="lrow"><div class="l">Резервная копия<small>${tCount} активных задач, ${dCount} выполненных, ${S.habits.length} ${plural(S.habits.length,'привычка','привычки','привычек')}</small></div><button class="btn sec sm" id="bExp">Сохранить</button></div>
    <div class="lrow"><div class="l">Восстановить из копии</div><button class="btn sec sm" id="bImp">Загрузить</button></div>
    <div class="lrow"><div class="l">Очистить выполненные</div><button class="btn sec sm" id="bClr">Очистить</button></div>
    <div class="lrow"><div class="l" style="color:var(--p3)">Удалить все данные</div><button class="btn danger sm" id="bWipe">Удалить</button></div>
   </div>
   <div class="card sec mt"><h3>📲 Как установить на iPhone</h3>
    <ol class="ol note"><li>Откройте адрес приложения в <b>Safari</b>.</li><li>Нажмите «Поделиться» (квадрат со стрелкой).</li><li>Выберите «На экран Домой» → «Добавить».</li><li>Запускайте с иконки — откроется на весь экран, работает без интернета.</li></ol>
    ${standalone?'<p class="note">✅ Приложение уже установлено.</p>':''}</div>
   <div class="card sec mt"><h3>🔔 О напоминаниях</h3>
    <p class="note">Веб-приложение присылает уведомления, пока оно открыто или недавно свёрнуто. Для важных дел нажмите в задаче «📅 В Календарь iPhone» — тогда напомнит системный Календарь, даже если приложение закрыто.</p></div>
   <div class="card sec mt"><h3>💾 Где хранятся данные</h3>
    <p class="note">Только на этом устройстве, в браузере. Никаких аккаунтов и серверов. ${storageOk?'':'<b style="color:var(--p3)">Сейчас хранилище недоступно — данные не сохранятся после закрытия.</b>'} Делайте резервную копию раз в пару недель: если долго не открывать веб-приложение, iOS может очистить его данные.</p></div>
   <p class="note" style="text-align:center;margin-top:20px">Мой планировщик · v3.3</p>`;
  main.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{S.settings.accent=b.dataset.acc;save();applyAccent();render()});
  main.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{S.settings.theme=b.dataset.th;save();applyTheme();render()});
  const nb=$('#nBtn');if(nb)nb.onclick=async()=>{
    if(S.settings.notify&&Notification.permission==='granted'){S.settings.notify=false;save();render();return}
    try{const p=await Notification.requestPermission();S.settings.notify=p==='granted';save();render();if(p==='granted')toast('Уведомления включены')}catch(e){toast('Не удалось включить уведомления')}};
  const nt=$('#nTest');if(nt)nt.onclick=()=>{notify('Проверка','Уведомления работают 👍');toast('Отправлено')};
  $('#defRem').onchange=e=>{S.settings.defRemind=e.target.value===''?null:+e.target.value;save()};
  $('#bExp').onclick=exportBackup;$('#bImp').onclick=importBackup;
  $('#bClr').onclick=()=>{const n=S.tasks.filter(t=>t.done).length;if(!n){toast('Выполненных задач нет');return}confirmBox(`Удалить ${n} ${plural(n,'выполненную задачу','выполненные задачи','выполненных задач')}?`,'',()=>{S.tasks=S.tasks.filter(t=>!t.done);save();render()})};
  $('#bWipe').onclick=()=>confirmBox('Удалить все данные?','Задачи, списки, привычки и статистика будут удалены без возможности восстановления. Сначала сохраните резервную копию.',()=>{S=defaults();S.seeded=true;save();applyTheme();render();toast('Все данные удалены')});
}
function exportBackup(){
  const json=JSON.stringify(Object.assign({app:'planner',version:1,exported:new Date().toISOString()},S));
  openSheet(`<div class="shead"><h2>Резервная копия</h2><button class="iconbtn" id="bx">${I.close}</button></div>
    <p class="note">Сохраните файл (например, в «Файлы» → iCloud Drive) или скопируйте текст и отправьте себе в заметки или мессенджер.</p>
    <div class="actions" style="margin-top:6px"><button class="btn" id="bFile">💾 Скачать файл</button><button class="btn sec" id="bCopy">Скопировать текст</button></div>
    <textarea class="inp mt" readonly style="min-height:110px;font-size:12px;font-family:ui-monospace,monospace">${esc(json)}</textarea>`);
  SI('#bx').onclick=()=>closeSheet();
  SI('#bFile').onclick=()=>{if(inFrame){toast('В предпросмотре скачивание недоступно — скопируйте текст');return}downloadText(`planner-backup-${today()}.json`,json,'application/json')};
  SI('#bCopy').onclick=async()=>{try{await navigator.clipboard.writeText(json);toast('Скопировано')}catch(e){const ta=SI('textarea');ta.focus();ta.select();toast('Выделите и скопируйте текст вручную')}};
}
function importBackup(){
  openSheet(`<div class="shead"><h2>Восстановить</h2><button class="iconbtn" id="bx">${I.close}</button></div>
   <p class="note">Выберите файл копии или вставьте её текст. Текущие данные будут заменены.</p>
   <div class="field"><input type="file" accept=".json,application/json,text/plain" id="bf" class="inp"></div>
   <div class="field"><textarea class="inp" id="bt" placeholder="…или вставьте текст копии сюда" style="min-height:90px;font-size:12px"></textarea></div>
   <div class="actions"><span class="sp"></span><button class="btn" id="bgo">Восстановить</button></div>`);
  SI('#bx').onclick=()=>closeSheet();
  SI('#bf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{SI('#bt').value=r.result};r.readAsText(f)};
  SI('#bgo').onclick=()=>{
    try{const p=JSON.parse(SI('#bt').value);if(!p||!Array.isArray(p.tasks)||!Array.isArray(p.lists))throw 0;
      const d=defaults();S=Object.assign(d,p);S.pomo=Object.assign(defaults().pomo,p.pomo||{});S.timer=defaults().timer;S.settings=Object.assign(defaults().settings,p.settings||{});
      delete S.app;delete S.version;delete S.exported;S.seeded=true;
      if(!S.lists.find(l=>l.id==='inbox'))S.lists.unshift(defaults().lists[0]);
      save();applyTheme();closeSheet(true);render();toast('Данные восстановлены')}
    catch(e){toast('Не получилось прочитать копию — проверьте файл')}};
}

/* ----- toast ----- */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3200)}

/* ========= boot ========= */
$('#menuBtn').innerHTML=I.menu;$('#menuBtn').onclick=openDrawer;
$('#fab').innerHTML=I.plus;
$('#fab').onclick=()=>{
  if(U.view==='tasks'){
    const pre={};if(U.list.startsWith('folder:')){const ls=listsIn(U.list.slice(7));if(ls[0])pre.listId=ls[0].id}else if(!SMART[U.list]&&!U.list.startsWith('tag:'))pre.listId=U.list;
    if(U.list==='today'||U.list==='week')pre.date=today();if(U.list==='tomorrow')pre.date=addDays(today(),1);
    if(U.list.startsWith('tag:'))pre.tags=[U.list.slice(4)];quickAdd(pre)}
  else if(U.view==='cal')quickAdd({date:U.calSel});
  else if(U.view==='habits')editHabit(null);
};
const TABS=[['tasks','Задачи',I.tasks],['cal','Календарь',I.cal],['habits','Привычки',I.habit],['focus','Фокус',I.focus],['more','Ещё',I.more]];
$('#tabs .wrap').innerHTML=TABS.map(([v,n,ic])=>`<button data-v="${v}">${ic}<span>${n}</span></button>`).join('');
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{U.view=b.dataset.v;if($('#sheet').classList.contains('on'))closeSheet();window.scrollTo(0,0);render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#menu').classList.contains('on')){closeMenu();return}if(U.sel){U.sel=null;render();return}if($('#dp').classList.contains('on')){$('#dp').classList.remove('on');return}if($('#sheet').classList.contains('on'))closeSheet();else closeDrawer()}});

// timer: если таймер «истёк» пока приложение было закрыто
if(S.timer.running&&timerLeft()<=0)finishTimer(true);
render();
setInterval(tick,500);
setInterval(checkReminders,15000);checkReminders();
let lastDay=today();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();checkReminders();if(today()!==lastDay){lastDay=today();render()}}});

if('serviceWorker' in navigator&&!inFrame&&location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{swReg=r;r.update()}).catch(()=>{});
  // когда новая версия установилась — один раз перезагрузить страницу
  let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload()});
}
